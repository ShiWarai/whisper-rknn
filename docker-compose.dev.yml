# Только dev-контейнер для линта и тестов (без NPU и prod-сервиса).
name: whisper-rknn-dev

services:
  dev:
    image: whisper-rknn-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: whisper-rknn-dev
    user: "${RUNNER_UID:-0}:${RUNNER_GID:-0}"
    volumes:
      - .:/app
    working_dir: /app
