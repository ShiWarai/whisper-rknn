name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/shiwarai/whisper-rknn

jobs:
  release:
    name: Build, push and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          push: true
          provenance: false

      - name: Prepare deploy bundle
        run: |
          set -e
          TAG="${{ steps.version.outputs.tag }}"
          BUNDLE="whisper-rknn-deploy-${TAG}"
          mkdir -p "dist/${BUNDLE}"
          cp docker-compose.yml .env.example "dist/${BUNDLE}/"
          sed "s/:main/:${TAG}/g" docker-compose.prod.yml > "dist/${BUNDLE}/docker-compose.prod.yml"
          cat > "dist/${BUNDLE}/DEPLOY.md" <<EOF
          # Deploy whisper-rknn ${TAG}

          1. Создайте сеть: \`docker network create whisper_rknn_default\`
          2. Скопируйте \`.env.example\` в \`.env\` и задайте \`WHISPER_MODELS_DIR\`
          3. Подтяните образ: \`docker pull ghcr.io/shiwarai/whisper-rknn:${TAG}\`
          4. Запуск: \`docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d\`
          EOF
          (cd dist && zip -r "../${BUNDLE}.zip" "${BUNDLE}")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: whisper-rknn-deploy-${{ steps.version.outputs.tag }}.zip

  notify-telegram-on-release:
    name: Notify Telegram on release
    needs: [release]
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification (silent)
        uses: appleboy/telegram-action@v1.0.1
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          disable_notification: true
          message: |
            *Релиз опубликован*
            Репозиторий: `${{ github.repository }}`
            Тег: `${{ github.ref_name }}`
            Образ: `ghcr.io/shiwarai/whisper-rknn:${{ github.ref_name }}`
            [Открыть Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }})
