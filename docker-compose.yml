# Только внутренняя связность: без портов на хост. Перед первым запуском:
#   docker network create whisper_rknn_default
# Другие контейнеры (бот и т.д.) подключайте к той же сети.
#
# Путь к папке с .rknn на хосте задаётся один раз: WHISPER_MODELS_DIR в файле .env

name: whisper-rknn

services:
  whisper-rknn:
    build: .
    image: whisper-rknn-api:latest
    platform: linux/arm64
    container_name: whisper-rknn-api
    privileged: true
    devices:
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap
    restart: unless-stopped
    entrypoint: ["./scripts/docker-entrypoint.sh"]
    environment:
      WHISPER_ROLE: ${WHISPER_ROLE:-all}
      WHISPER_RUNTIME: ${WHISPER_RUNTIME:-local}
      WHISPER_DOWNLOAD_MODELS: ${WHISPER_DOWNLOAD_MODELS:-0}
      WHISPER_MODEL_URLS: ${WHISPER_MODEL_URLS:-}
      WHISPER_MODELS_DIR: /models
      WHISPER_MODEL_PROFILE: ${WHISPER_MODEL_PROFILE:-turbo}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ru}
      WHISPER_NPU_CORE_MASK: ${WHISPER_NPU_CORE_MASK:-0_1_2}
      WHISPER_PARALLEL_ENCODE: ${WHISPER_PARALLEL_ENCODE:-1}
      WHISPER_ENCODER_WORKERS: ${WHISPER_ENCODER_WORKERS:-0}
      WHISPER_ENCODER_MAX_WORKERS: ${WHISPER_ENCODER_MAX_WORKERS:-}
      WHISPER_CPU_AFFINITY: ${WHISPER_CPU_AFFINITY:-}
      WHISPER_ONNX_INTRA_OP_THREADS: ${WHISPER_ONNX_INTRA_OP_THREADS:-0}
      WHISPER_MAX_CHUNK_SECONDS: ${WHISPER_MAX_CHUNK_SECONDS:-30}
      WHISPER_VAD_THRESHOLD: ${WHISPER_VAD_THRESHOLD:-0.5}
      WHISPER_VAD_SEARCH_BACK_SEC: ${WHISPER_VAD_SEARCH_BACK_SEC:-3}
      WHISPER_VAD_MIN_GAP_MS: ${WHISPER_VAD_MIN_GAP_MS:-250}
      WHISPER_ENCODER: /models/encoder.rknn
      WHISPER_DECODER: ${WHISPER_DECODER:-/models/decoder.onnx}
      WHISPER_DECODER_BACKEND: ${WHISPER_DECODER_BACKEND:-onnx}
      WHISPER_TOKENS: /models/tokens.txt
      HOST: "0.0.0.0"
      PORT: ${PORT:-8080}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      WHISPER_MAX_AUDIO_SECONDS: ${WHISPER_MAX_AUDIO_SECONDS:-600}
      WHISPER_CHUNK_SECONDS: ${WHISPER_CHUNK_SECONDS:-}
      WHISPER_CHUNK_OVERLAP_SECONDS: ${WHISPER_CHUNK_OVERLAP_SECONDS:-2}
      WHISPER_MIN_TAIL_SECONDS: ${WHISPER_MIN_TAIL_SECONDS:-8}
      WHISPER_MAX_DECODE_TOKENS: ${WHISPER_MAX_DECODE_TOKENS:-0}
      WHISPER_TRUNCATE_RETRY_SECONDS: ${WHISPER_TRUNCATE_RETRY_SECONDS:-10}
      WHISPER_MAX_NGRAM_REPEAT: ${WHISPER_MAX_NGRAM_REPEAT:-6}
      WHISPER_API_KEY: ${WHISPER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FFMPEG_BIN: ${FFMPEG_BIN:-}
    volumes:
      - ${WHISPER_MODELS_DIR}:/models
    networks:
      - whisper_rknn_default
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; p=os.environ.get('PORT','8080'); urllib.request.urlopen('http://127.0.0.1:%s/health' % p, timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  whisper_cache:

networks:
  whisper_rknn_default:
    external: true
