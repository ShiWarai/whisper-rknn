# Распределённый whisper-rknn на одном хосте RK3588.
# Один сервис encoder = encoder pool на всех dedicated NPU cores (как monolith).
# Дополнительные decoder-* / encoder-* — в k3s через DECODER_TARGETS / ENCODER_TARGETS.
#
# Запуск:
#   docker network create whisper_rknn_default
#   cp .env.example .env
#   docker compose -f docker-compose.distributed.yml up -d --build

name: whisper-rknn-distributed

x-common-env: &common-env
  WHISPER_DOWNLOAD_MODELS: ${WHISPER_DOWNLOAD_MODELS:-0}
  WHISPER_MODEL_URLS: ${WHISPER_MODEL_URLS:-}
  WHISPER_MODELS_DIR: /models
  WHISPER_MODEL_PROFILE: ${WHISPER_MODEL_PROFILE:-turbo}
  WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ru}
  WHISPER_ENCODER: /models/encoder.rknn
  WHISPER_DECODER: ${WHISPER_DECODER:-/models/decoder.onnx}
  WHISPER_DECODER_BACKEND: ${WHISPER_DECODER_BACKEND:-onnx}
  WHISPER_TOKENS: /models/tokens.txt
  WHISPER_MAX_CHUNK_SECONDS: ${WHISPER_MAX_CHUNK_SECONDS:-30}
  WHISPER_VAD_THRESHOLD: ${WHISPER_VAD_THRESHOLD:-0.5}
  WHISPER_VAD_SEARCH_BACK_SEC: ${WHISPER_VAD_SEARCH_BACK_SEC:-3}
  WHISPER_VAD_MIN_GAP_MS: ${WHISPER_VAD_MIN_GAP_MS:-250}
  WHISPER_MAX_AUDIO_SECONDS: ${WHISPER_MAX_AUDIO_SECONDS:-600}
  WHISPER_API_KEY: ${WHISPER_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

x-service-base: &service-base
  build: .
  image: whisper-rknn-api:latest
  platform: linux/arm64
  restart: unless-stopped
  entrypoint: ["./scripts/docker-entrypoint.sh"]
  volumes:
    - ${WHISPER_MODELS_DIR}:/models:ro
  networks:
    - whisper_rknn_default

x-encoder-base: &encoder-base
  <<: *service-base
  privileged: true
  healthcheck:
    disable: true
  devices:
    - /dev/mpp_service:/dev/mpp_service
    - /dev/rga:/dev/rga
    - /dev/dri:/dev/dri
    - /dev/dma_heap:/dev/dma_heap
  environment:
    <<: *common-env
    WHISPER_ROLE: encoder
    WHISPER_NPU_CORE_MASK: ${WHISPER_NPU_CORE_MASK:-0_1_2}
    WHISPER_ENCODER_WORKERS: ${WHISPER_ENCODER_WORKERS:-0}
    WHISPER_ENCODER_MAX_WORKERS: ${WHISPER_ENCODER_MAX_WORKERS:-}
    WHISPER_CPU_AFFINITY: ${WHISPER_CPU_AFFINITY:-}
    GRPC_HOST: "0.0.0.0"
    GRPC_PORT: "50051"

x-decoder-base: &decoder-base
  <<: *service-base
  healthcheck:
    disable: true
  environment:
    <<: *common-env
    WHISPER_ROLE: decoder
    WHISPER_CPU_AFFINITY: ${WHISPER_CPU_AFFINITY:-}
    WHISPER_ONNX_INTRA_OP_THREADS: ${WHISPER_ONNX_INTRA_OP_THREADS:-0}
    GRPC_HOST: "0.0.0.0"
    GRPC_PORT: "50052"

services:
  gateway:
    <<: *service-base
    container_name: whisper-rknn-gateway
    environment:
      <<: *common-env
      WHISPER_ROLE: gateway
      WHISPER_RUNTIME: distributed
      HOST: "0.0.0.0"
      PORT: ${PORT:-8080}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_INFLIGHT_JOBS: ${MAX_INFLIGHT_JOBS:-2}
      ENCODER_TARGETS: ${ENCODER_TARGETS:-encoder-0:50051}
      DECODER_TARGETS: ${DECODER_TARGETS:-decoder-0:50052}
    depends_on:
      decoder-0:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; p=os.environ.get('PORT','8080'); urllib.request.urlopen('http://127.0.0.1:%s/health' % p, timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  encoder-0:
    <<: *encoder-base
    container_name: whisper-rknn-encoder-0

  decoder-0:
    <<: *decoder-base
    container_name: whisper-rknn-decoder-0

networks:
  whisper_rknn_default:
    external: true
